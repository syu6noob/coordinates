name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          project_version="$(./gradlew properties --no-daemon -q | sed -n 's/^version: //p')"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version ($tag_version) does not match Gradle version ($project_version)."
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew build --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          build/libs/Coordinates.jar
          --verify-tag
          --generate-notes
          --title "Coordinates $RELEASE_TAG"
