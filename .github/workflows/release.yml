name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(./gradlew properties --no-daemon -q | sed -n 's/^version: //p')"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version ($tag_version) does not match Gradle version ($project_version)."
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew build --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          build/libs/Coordinates.jar
          --verify-tag
          --generate-notes
          --title "Coordinates ${{ github.ref_name }}"
